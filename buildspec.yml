# M4: CodeBuild builds the Fargate worker image from ./worker and pushes it to ECR.
# ECR_URI is set on the CodeBuild project (subtitle-worker-build).
version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI
  build:
    commands:
      - docker build -t $ECR_URI:latest ./worker
  post_build:
    commands:
      - docker push $ECR_URI:latest
